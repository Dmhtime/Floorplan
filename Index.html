<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Simple Floorplan Scanner (iPad Quick Mode)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, sans-serif; touch-action: manipulation; }
    canvas { touch-action: none; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Top Bar with Switcher to Original Full Studio -->
  <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <span class="w-3 h-3 rounded-full bg-emerald-400"></span>
      <h1 class="font-bold text-lg tracking-tight">QuickFloor <span class="text-xs font-normal text-slate-400">Simple Mode</span></h1>
    </div>
    <div class="flex items-center gap-2">
      <a href="index.html" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-medium text-sky-400 border border-slate-700">
        Switch to Full 2D/3D Studio &rarr;
      </a>
    </div>
  </header>

  <!-- Main Single-Screen Workspace -->
  <main class="flex-1 grid grid-cols-1 lg:grid-cols-3 gap-4 p-4 max-w-6xl w-full mx-auto">

    <!-- Left Column: Big Touch Controls -->
    <div class="flex flex-col gap-4">
      
      <!-- Step 1: Load LiDAR Scan OR Use Camera -->
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-4">
        <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-3">1. Capture or Import</h2>
        
        <label class="flex flex-col items-center justify-center border-2 border-dashed border-sky-500/40 hover:border-sky-400 bg-sky-950/20 rounded-xl p-5 cursor-pointer transition text-center">
          <span class="text-sm font-semibold text-sky-300">Tap to Load iPad LiDAR Scan</span>
          <span class="text-xs text-slate-400 mt-1">Supports RoomPlan .JSON or .OBJ</span>
          <input type="file" id="fileInput" accept=".json,.obj" class="hidden" />
        </label>

        <div class="grid grid-cols-2 gap-2 mt-3">
          <button id="btnCamera" class="py-3 px-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 font-semibold text-sm">
            AR Camera Plot
          </button>
          <button id="btnSample" class="py-3 px-3 rounded-xl bg-slate-800 hover:bg-slate-700 font-semibold text-sm text-slate-200">
            Load Demo Room
          </button>
        </div>
      </div>

      <!-- Live AR Camera Drawer (Hidden until tapped) -->
      <div id="cameraBox" class="hidden bg-slate-900 border border-slate-800 rounded-xl p-3 flex flex-col gap-2">
        <div class="relative rounded-lg overflow-hidden bg-black aspect-video">
          <video id="video" autoplay playsinline muted class="w-full h-full object-cover"></video>
          <!-- Crosshair -->
          <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
            <div class="w-8 h-8 border-2 border-emerald-400 rounded-full flex items-center justify-center">
              <div class="w-1.5 h-1.5 bg-emerald-400 rounded-full"></div>
            </div>
          </div>
          <div id="hudPitch" class="absolute bottom-2 left-2 bg-black/70 text-xs px-2 py-1 rounded text-emerald-300 font-mono">
            Aim at floor-wall corner
          </div>
        </div>
        <div class="flex gap-2">
          <button id="btnAddCorner" class="flex-1 py-3 bg-emerald-500 text-slate-950 font-bold rounded-lg text-sm">
            + Mark Corner
          </button>
          <button id="btnClearPoints" class="py-3 px-4 bg-slate-800 text-slate-300 rounded-lg text-sm">
            Reset
          </button>
        </div>
      </div>

      <!-- Step 2: Live Room Stats -->
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 grid grid-cols-2 gap-3">
        <div>
          <div class="text-xs text-slate-400">Total Area</div>
          <div id="statArea" class="text-2xl font-bold text-white">0 sq ft</div>
        </div>
        <div>
          <div class="text-xs text-slate-400">Perimeter</div>
          <div id="statPerim" class="text-2xl font-bold text-sky-400">0.0 ft</div>
        </div>
      </div>

      <!-- Step 3: 1-Tap Export -->
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 mt-auto">
        <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-3">2. Instant Export</h2>
        <div class="grid grid-cols-3 gap-2">
          <button id="btnSquare" class="py-2.5 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs font-semibold text-amber-300 border border-amber-500/30">
            Snap 90°
          </button>
          <button id="btnExportDXF" class="py-2.5 bg-sky-600 hover:bg-sky-500 rounded-lg text-xs font-bold">
            Export .DXF
          </button>
          <button id="btnExportJSON" class="py-2.5 bg-indigo-600 hover:bg-indigo-500 rounded-lg text-xs font-bold">
            Save .JSON
          </button>
        </div>
      </div>
    </div>

    <!-- Right Column: Clean 2D Blueprint Canvas -->
    <div class="lg:col-span-2 bg-slate-900 border border-slate-800 rounded-xl p-3 flex flex-col min-h-[420px]">
      <div class="flex justify-between items-center mb-2 px-1">
        <span class="text-xs text-slate-400">Tap or drag corners on canvas to fine-tune dimensions</span>
        <span class="text-xs font-mono text-slate-500">Scale: Feet & Inches</span>
      </div>
      <div class="relative flex-1 bg-slate-950 rounded-lg overflow-hidden border border-slate-800">
        <canvas id="floorCanvas" class="w-full h-full block"></canvas>
      </div>
    </div>

  </main>

  <script>
    const canvas = document.getElementById('floorCanvas');
    const ctx = canvas.getContext('2d');
    // Points stored in meters: [{x, y}]
    let points = [
      { x: -2.4, y: -1.8 },
      { x:  2.4, y: -1.8 },
      { x:  2.4, y:  1.8 },
      { x: -2.4, y:  1.8 }
    ];
    let dragIdx = -1;
    let pitchDeg = 60, yawDeg = 0;
    const CAM_HEIGHT_M = 1.4; // Typical iPad holding height

    function resize() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
      draw();
    }
    window.addEventListener('resize', resize);

    function metersToFeetStr(m) {
      const totalIn = Math.round(m * 39.3701);
      const ft = Math.floor(totalIn / 12);
      const inch = totalIn % 12;
      return `${ft}' ${inch}"`;
    }

    function computeStats() {
      if (points.length < 3) {
        document.getElementById('statArea').textContent = '0 sq ft';
        document.getElementById('statPerim').textContent = '0.0 ft';
        return;
      }
      let areaM2 = 0, perimM = 0;
      for (let i = 0; i < points.length; i++) {
        const p1 = points[i], p2 = points[(i + 1) % points.length];
        areaM2 += (p1.x * p2.y - p2.x * p1.y);
        perimM += Math.hypot(p2.x - p1.x, p2.y - p1.y);
      }
      areaM2 = Math.abs(areaM2) / 2;
      document.getElementById('statArea').textContent = `${Math.round(areaM2 * 10.7639)} sq ft`;
      document.getElementById('statPerim').textContent = `${(perimM * 3.28084).toFixed(1)} ft`;
    }

    function toScreen(pt) {
      const scale = Math.min(canvas.width, canvas.height) / 8; // 8m view span
      return { x: canvas.width / 2 + pt.x * scale, y: canvas.height / 2 + pt.y * scale, scale };
    }

    function toWorld(sx, sy) {
      const scale = Math.min(canvas.width, canvas.height) / 8;
      return { x: (sx - canvas.width / 2) / scale, y: (sy - canvas.height / 2) / scale };
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Subtle Grid
      const step = Math.min(canvas.width, canvas.height) / 16;
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 1;
      for (let x = canvas.width / 2 % step; x < canvas.width; x += step) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }
      for (let y = canvas.height / 2 % step; y < canvas.height; y += step) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }

      if (points.length === 0) return;

      // Room Polygon Fill
      ctx.beginPath();
      points.forEach((p, i) => {
        const s = toScreen(p);
        if (i === 0) ctx.moveTo(s.x, s.y); else ctx.lineTo(s.x, s.y);
      });
      if (points.length > 2) ctx.closePath();
      ctx.fillStyle = 'rgba(14, 165, 233, 0.12)';
      ctx.fill();
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 4;
      ctx.stroke();

      // Wall Length Labels & Corner Handles
      points.forEach((p1, i) => {
        const p2 = points[(i + 1) % points.length];
        const s1 = toScreen(p1), s2 = toScreen(p2);

        if (points.length > 1) {
          const lenM = Math.hypot(p2.x - p1.x, p2.y - p1.y);
          const mx = (s1.x + s2.x) / 2, my = (s1.y + s2.y) / 2;
          ctx.fillStyle = '#0f172a';
          ctx.fillRect(mx - 28, my - 11, 56, 22);
          ctx.fillStyle = '#e2e8f0';
          ctx.font = 'bold 12px monospace';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(metersToFeetStr(lenM), mx, my);
        }

        ctx.beginPath();
        ctx.arc(s1.x, s1.y, 8, 0, Math.PI * 2);
        ctx.fillStyle = '#10b981';
        ctx.fill();
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 2;
        ctx.stroke();
      });

      computeStats();
    }

    // Drag corners on touch/mouse
    canvas.addEventListener('pointerdown', e => {
      const rect = canvas.getBoundingClientRect();
      const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
      dragIdx = points.findIndex(p => {
        const s = toScreen(p);
        return Math.hypot(s.x - sx, s.y - sy) < 22;
      });
    });
    canvas.addEventListener('pointermove', e => {
      if (dragIdx < 0) return;
      const rect = canvas.getBoundingClientRect();
      points[dragIdx] = toWorld(e.clientX - rect.left, e.clientY - rect.top);
      draw();
    });
    window.addEventListener('pointerup', () => dragIdx = -1);

    // Snap 90-degree Orthogonal Walls
    document.getElementById('btnSquare').addEventListener('click', () => {
      for (let i = 1; i < points.length; i++) {
        const prev = points[i - 1], cur = points[i];
        if (Math.abs(cur.x - prev.x) < Math.abs(cur.y - prev.y)) cur.x = prev.x;
        else cur.y = prev.y;
      }
      draw();
    });

    // Demo Room
    document.getElementById('btnSample').addEventListener('click', () => {
      points = [
        { x: -2.8, y: -2.1 }, { x: 1.2, y: -2.1 }, { x: 1.2, y: -0.6 },
        { x: 2.8, y: -0.6 },  { x: 2.8, y: 2.1 },  { x: -2.8, y: 2.1 }
      ];
      draw();
    });

    // Import RoomPlan JSON or OBJ
    document.getElementById('fileInput').addEventListener('change', async e => {
      const file = e.target.files[0];
      if (!file) return;
      const text = await file.text();
      if (file.name.endsWith('.json')) {
        const data = JSON.parse(text);
        if (Array.isArray(data.points)) {
          points = data.points;
        } else if (Array.isArray(data.walls)) {
          // Extract perimeter corners from RoomPlan walls array
          points = data.walls.map(w => ({
            x: (w.transform?.[12] ?? w.x ?? 0),
            y: (w.transform?.[14] ?? w.z ?? 0)
          }));
        }
      } else if (file.name.endsWith('.obj')) {
        const verts = [];
        text.split('\n').forEach(line => {
          if (line.startsWith('v ')) {
            const [, x, , z] = line.trim().split(/\s+/).map(Number);
            verts.push({ x, y: z });
          }
        });
        if (verts.length) {
          const xs = verts.map(v => v.x), ys = verts.map(v => v.y);
          points = [
            { x: Math.min(...xs), y: Math.min(...ys) },
            { x: Math.max(...xs), y: Math.min(...ys) },
            { x: Math.max(...xs), y: Math.max(...ys) },
            { x: Math.min(...xs), y: Math.max(...ys) }
          ];
        }
      }
      draw();
    });

    // Live AR Camera & Gyro Plotter
    document.getElementById('btnCamera').addEventListener('click', async () => {
      const box = document.getElementById('cameraBox');
      box.classList.toggle('hidden');
      if (!box.classList.contains('hidden')) {
        try {
          if (typeof DeviceOrientationEvent?.requestPermission === 'function') {
            await DeviceOrientationEvent.requestPermission();
          }
          window.addEventListener('deviceorientation', ev => {
            pitchDeg = Math.max(15, Math.min(85, ev.beta || 60));
            yawDeg = ev.alpha || 0;
            const dist = CAM_HEIGHT_M * Math.tan((pitchDeg * Math.PI) / 180);
            document.getElementById('hudPitch').textContent = `Dist: ${metersToFeetStr(dist)} | Yaw: ${Math.round(yawDeg)}°`;
          });
          const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
          document.getElementById('video').srcObject = stream;
        } catch (err) {
          document.getElementById('hudPitch').textContent = 'Simulation Mode (Tap + Mark Corner)';
        }
      }
    });

    document.getElementById('btnAddCorner').addEventListener('click', () => {
      const dist = Math.min(4.0, CAM_HEIGHT_M * Math.tan((pitchDeg * Math.PI) / 180));
      const rad = (yawDeg * Math.PI) / 180;
      points.push({ x: +(Math.sin(rad) * dist).toFixed(2), y: +(-Math.cos(rad) * dist).toFixed(2) });
      yawDeg = (yawDeg + 90) % 360;
      draw();
    });

    document.getElementById('btnClearPoints').addEventListener('click', () => { points = []; draw(); });

    // Export DXF
    document.getElementById('btnExportDXF').addEventListener('click', () => {
      let dxf = '0\nSECTION\n2\nENTITIES\n';
      for (let i = 0; i < points.length; i++) {
        const p1 = points[i], p2 = points[(i + 1) % points.length];
        dxf += `0\nLINE\n8\nWALLS\n10\n${p1.x}\n20\n${p1.y}\n11\n${p2.x}\n21\n${p2.y}\n`;
      }
      dxf += '0\nENDSEC\n0\nEOF\n';
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([dxf], { type: 'application/dxf' }));
      a.download = 'floorplan-simple.dxf';
      a.click();
    });

    // Export JSON (Compatible with Original Pro Studio)
    document.getElementById('btnExportJSON').addEventListener('click', () => {
      const payload = JSON.stringify({ version: '1.0', units: 'meters', points }, null, 2);
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([payload], { type: 'application/json' }));
      a.download = 'roomplan-scan.json';
      a.click();
    });

    resize();
  </script>
</body>
</html>
